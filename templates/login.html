{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0 p-4">
            <h3 class="text-center mb-4 fw-bold text-success">☕ Cocoffe Login</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required placeholder="Ej. admin">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required placeholder="********">
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Ingresar al Sistema</button>
            </form>
            <div class="text-muted text-center mt-3 small">Credenciales por defecto: admin / admin123</div>
        </div>
    </div>
</div>
{% endblock %}
